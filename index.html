<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 50px;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 25px;
      margin: auto;
      width: 80%;
      max-width: 350px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #ccc;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 90%;
      padding: 13px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .enter {
      background: #333;
      color: white;
    }

    .tiktok {
      background: #000;
      color: white;
    }

    .whatsapp {
      background: #25D366;
      color: white;
    }

    #app {
      display: none;
    }

    #error {
      color: red;
    }
  </style>
</head>

<body>

 
  <div class="box" id="login">
    <h2>Access Key</h2>

    <input
      type="password"
      id="key"
      placeholder="Enter Access Key"
    >

    <button class="enter" onclick="checkKey()">
      Enter
    </button>

    <p id="error"></p>
  </div>


  
  <div class="box" id="app">

    <h2>Welcome </h2>

    <button class="tiktok" onclick="openTikTok()">
      Open TikTok
    </button>

    <button class="whatsapp" onclick="openWhatsApp()">
       Open WhatsApp
    </button>

  </div>


  <script>

    
    const ACCESS_KEY = "Domuismine"


    function checkKey() {

      const key = document.getElementById("key").value;

      if (key === ACCESS_KEY) {

        document.getElementById("login").style.display = "none";
        document.getElementById("app").style.display = "block";

      } else {

        document.getElementById("error").innerText =
          "❌ Wrong Access Key";

      }
    }


    function openTikTok() {
      window.location.href = "https://www.tiktok.com/@izuku.izuku828?_r=1&_t=ZS-9ABFUJWa9Ug";
    }


    function openWhatsApp() {
      window.location.href = "https://chat.whatsapp.com/DAZxFaIfMxFIiKX1zWMV0u";
    }

  </script>

</body>
</html>
